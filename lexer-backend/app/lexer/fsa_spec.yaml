name: PORTIA-FSA
version: 1.1
description: Canonical, machine-readable summary of tokens, states, and delimiters (exactly transcribed from TD images).
note: |
  State organization:
  - s0: Initial/start state
  - s1-s151: Keywords FSA (ends at s151 with loop_delim)
  - s152-s219: Operators and Reserved Symbols FSA (ends at s219 with newline_delim)
  - s220-s269: Identifiers FSA
  - s168,s270,s272-s275: Comments FSA (single: s168→s270; multi: s168→s272→s275)
  - s276-s277: String Literals FSA (starts s276 with ", ends s277 with str_lit_delim)
  - s278-s360: Number Literals FSA

character_classes:
  alphabetic_chars: A-Z a-z
  numbers: 0-9
  alphanum: A-Z a-z 0-9
  whitespace: [" ", "\t"]
  newline: ["\n"]

dispatch_from_s0:
  letters_or_underscore: s220
  digits: s278
  quote_double: s276
  slash: s168
  operators:
    "-": s152
    "+": s158
    "*": s164
    "%": s172
    "!": s182
    "=": s186
    "&": s176
    "|": s179
    "<": s190
    ">": s194
  reserved_symbols:
    "(": s198
    ")": s200
    "[": s206
    "]": s208
    "{": s202
    "}": s204
    ";": s210
    ",": s212
    ":": s218
    ".": s214

keywords:
  note: "Keywords FSA: s1-s151, ends at s151 with loop_delim"
  bool: s5
  break: s10
  case: s15
  char: s19
  const: s24
  default: s32
  do: s34
  double: s39
  else: s44
  false: s50
  float: s55
  for: s58
  func: s62
  global: s69
  if: s72
  int: s75
  local: s81
  long: s84
  main: s89
  return: s96
  string: s103
  switch: s109
  thread: s116
  threadln: s119
  trap: s123
  true: s126
  using: s132
  var: s136
  void: s140
  weave: s146
  while: s151

operators_and_reserved_symbols:
  note: "Operators and Reserved Symbols FSA: s152-s219, ends at s219 with newline_delim"
  note2: "These are NOT strictly delimiters - they are reserved symbols connected with operators"
  minus: s153
  decrement: s155
  minus_assign: s157
  plus: s159
  increment: s161
  add_assign: s163
  multiply: s165
  mult_assign: s167
  divide: s169
  div_assign: s171
  modulo: s173
  modulo_assign: s175
  logical_and: s178
  logical_or: s181
  not: s183
  not_equal: s185
  assign: s187
  equal_equal: s189
  less_than: s191
  less_equal: s193
  greater_than: s195
  greater_equal: s197
  open_paren: s199
  close_paren: s201
  open_bracket: s207
  close_bracket: s209
  open_curly: s203
  close_curly: s205
  semicolon: s211
  comma: s213
  colon: s219
  dot: s215
  concat: s217

comments:
  note: "Comments FSA: s168, s270, s272-s275"
  single_line:
    start_slash: s168
    second_slash: s270
    note: "Single-line: s168 (/) → s270 (/) → ends at newline"
  multi_line:
    start_slash: s168
    star: s272
    after_star: s274
    close_slash: s275
    note: "Multi-line: s168 (/) → s272 (*) → s274 (*) → s275 (/) with multi_delim"

string_literals:
  note: "String Literals FSA: s276-s277"
  start: s276
  end: s277
  escapes_allowed: ['\\"', '\\\\', '\\n', '\\t']
  newline_invalid: true
  delimiter: str_lit_delim
  note2: "Starts at s276 with \", ends at s277 with str_lit_delim"

numeric_literals:
  note: "Number Literals FSA: s278-s360"
  start: s278
  end: s360
  classify:
    integer:
      int_lit: "<= 10 digits"
      long_lit: "> 10 digits (max 19)"
    floating:
      float_lit: "<= 7 total digits"
      double_lit: "> 7 total digits (max 17)"
  delimiter_set: nbl_delim
  unary_minus_allowed_before: ["number", "("]

identifiers:
  note: "Identifiers FSA: s220-s269"
  start_state: s220
  end_state: s269
  start: letter_or_underscore
  continue: letter_or_digit_or_underscore
  delimiter_set: iden_delim
  keyword_overrides: true

delimiters_reference:
  file: app/lexer/delimiters.py
  sets_used:
    - negative_delim
    - modulo_delim
    - marithmetic_delim
    - sign_delim
    - asign_delim
    - logical_op_delim
    - increment_delim
    - decrement_delim
    - concat_delim
    - open_paren_delim
    - close_paren_delim
    - open_bracket_delim
    - close_bracket_delim
    - open_curly_delim
    - close_curly_delim
    - semicolon_delim
    - comma_delim
    - colon_delim
    - dot_delim
    - str_lit_delim
    - nbl_delim
    - iden_delim
    - loop_delim
    - block_delim
    - return_delim


