name: PORTIA-FSA
version: 1.0
description: Canonical, machine-readable summary of tokens, states, and delimiters (exactly transcribed from TD images).

character_classes:
  alphabetic_chars: A-Z a-z
  numbers: 0-9
  alphanum: A-Z a-z 0-9
  whitespace: [" ", "\t"]
  newline: ["\n"]

dispatch_from_s0:
  letters_or_underscore: s220
  digits: s280
  quote_double: s277
  slash: s168
  operators:
    "-": s152
    "+": s158
    "*": s164
    "%": s172
    "!": s182
    "=": s186
    "&": s176
    "|": s179
    "<": s190
    ">": s194
  punctuation:
    "(": s198
    ")": s200
    "[": s206
    "]": s208
    "{": s202
    "}": s204
    ";": s210
    ",": s212
    ":": s218
    ".": s214

keywords:
  bool: s5
  break: s10
  case: s15
  char: s19
  const: s24
  default: s32
  do: s34
  double: s39
  else: s44
  false: s50
  float: s55
  for: s58
  func: s62
  global: s69
  if: s72
  int: s75
  local: s81
  long: s84
  main: s89
  return: s96
  string: s103
  switch: s109
  thread: s116
  threadln: s119
  trap: s123
  true: s126
  using: s132
  var: s136
  void: s140
  weave: s146
  while: s151

operators:
  minus: s153
  decrement: s155
  minus_assign: s157
  plus: s159
  increment: s161
  add_assign: s163
  multiply: s165
  mult_assign: s167
  divide: s169
  div_assign: s171
  modulo: s173
  modulo_assign: s175
  logical_and: s178
  logical_or: s181
  not: s183
  not_equal: s185
  assign: s187
  equal_equal: s189
  less_than: s191
  less_equal: s193
  greater_than: s195
  greater_equal: s197

punctuation:
  open_paren: s199
  close_paren: s201
  open_bracket: s207
  close_bracket: s209
  open_curly: s203
  close_curly: s205
  semicolon: s211
  comma: s213
  colon: s219
  dot: s215
  concat: s217

comments:
  single_line:
    entry: s168
    loop: s271
    end: s272
    note: Starts with '//' and ends at newline; newline not included.
  multi_line:
    entry: s168
    start: s273
    after_star: s274
    close_slash: s275
    end: s276
    note: Starts with '/*' and ends at '*/' (final at s276). Unterminated at EOF is error.

string_literals:
  start: s277
  escape: s279
  end: s278
  escapes_allowed: ['\\"', '\\\\', '\\n', '\\t']
  newline_invalid: true

numeric_literals:
  integer_part: s280
  after_decimal_waiting_digit: s338
  fractional_part: s337
  classify:
    integer:
      int_lit: "<= 10 digits"
      long_lit: "> 10 digits (max 19)"
    floating:
      float_lit: "<= 7 total digits"
      double_lit: "> 7 total digits (max 17)"
  delimiter_set: nbl_delim
  unary_minus_allowed_before: ["number", "("]
  finals:
    int: [s280, s282, s284, s286, s288, s290, s292, s294, s296, s298]
    long: [s300, s302, s304, s306, s308, s310, s312, s314, s316, s318, s320, s322, s324, s326, s328, s330, s332, s334, s336]
    float: [s339, s341, s343, s345, s347, s349, s351]
    double: [s353, s355, s357, s359, s361, s363, s365, s367, s369, s371, s373, s375, s377, s379, s381, s383]

identifiers:
  state: s220
  start: letter_or_underscore
  continue: letter_or_digit_or_underscore
  delimiter_set: iden_delim
  keyword_overrides: true
  finals:
    [s221, s223, s225, s227, s229, s231, s233, s235, s237, s239, s241, s243, s245, s247, s249, s251, s254, s256, s258, s260, s262, s264, s266, s268, s270]

delimiters_reference:
  file: app/lexer/delimiters.py
  sets_used:
    - negative_delim
    - modulo_delim
    - marithmetic_delim
    - sign_delim
    - asign_delim
    - logical_op_delim
    - increment_delim
    - decrement_delim
    - concat_delim
    - open_paren_delim
    - close_paren_delim
    - open_bracket_delim
    - close_bracket_delim
    - open_curly_delim
    - close_curly_delim
    - semicolon_delim
    - comma_delim
    - colon_delim
    - dot_delim
    - str_lit_delim
    - nbl_delim
    - iden_delim
    - loop_delim
    - block_delim
    - return_delim


